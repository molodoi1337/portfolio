<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бронирование — Бистро «Перец»</title>
  <meta name="description" content="Бистро «Перец» — авторская кухня с характером. Москва, ул. Пряная, 12.">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌶</text></svg>">
</head>
<body>
<main>
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Онлайн-бронь</span>
      <h1>Забронировать стол</h1>
      <p class="lead">Выберите дату и время — мы перезвоним в течение 15 минут для подтверждения.</p>
    </div>
  </section>
  <section class="section">
    <div class="container form-wrap">
      <form class="form" id="booking-form" novalidate>
        <div class="form__row">
          <div class="field" data-field="date"><label for="date">Дата</label><input type="date" id="date" name="date" required><span class="field__err"></span></div>
          <div class="field"><label>Гостей</label>
            <div class="guests"><button type="button" id="minus" aria-label="Меньше">−</button><output id="guests">2</output><button type="button" id="plus" aria-label="Больше">+</button></div>
          </div>
        </div>
        <div class="field" data-field="time"><label>Время</label><div class="slots" id="slots"></div><span class="field__err"></span></div>
        <div class="field"><label for="zone">Зона</label>
          <select id="zone" name="zone"><option value="hall">Основной зал</option><option value="bar">У барной стойки</option><option value="terrace">Веранда</option><option value="window">У окна</option></select>
        </div>
        <div class="form__row">
          <div class="field" data-field="name"><label for="name">Имя</label><input id="name" name="name" placeholder="Как к вам обращаться" autocomplete="name"><span class="field__err"></span></div>
          <div class="field" data-field="phone"><label for="phone">Телефон</label><input id="phone" name="phone" type="tel" placeholder="+7 (___) ___-__-__" autocomplete="tel"><span class="field__err"></span></div>
        </div>
        <div class="field"><label for="comment">Комментарий</label><textarea id="comment" name="comment" rows="3" placeholder="День рождения, детский стул, аллергии…"></textarea></div>
        <button class="btn btn--red" type="submit">Отправить заявку →</button>
      </form>
      <aside class="aside-card">
        <h3>Ваша бронь</h3>
        <ul>
          <li><span>Дата</span><b id="s-date">—</b></li>
          <li><span>Время</span><b id="s-time">—</b></li>
          <li><span>Гостей</span><b id="s-guests">2</b></li>
          <li><span>Зона</span><b id="s-zone">—</b></li>
        </ul>
        <p style="opacity:.7;font-size:14px">Бронь держится 15 минут. Для компаний от 10 человек — депозит 2 000 ₽ с гостя.</p>
      </aside>
    </div>
  </section>
  <div class="modal" id="modal" data-close>
    <div class="modal__box">
      <div class="modal__icon">🌶</div>
      <h3>Заявка принята!</h3>
      <p id="m-text"></p>
      <button class="btn" data-close onclick="this.closest('.modal').classList.remove('open')">Отлично</button>
    </div>
  </div>
</main>

  <script src="js/main.js"></script>
</body>
</html>
